# Powervault P3 — Pylontech Battery Health Sensors
#
# Append these sensors to your mqtt.yaml under the sensor: key.
# Replace "PV001001DEV" with your device ID.
#
# Each pylontech/info message contains one measurement at a time, e.g.:
#   [{"measurement": "StateOfHealth", "type": "Avg", "value": 92}]
#
# The template pattern reads value_json[0] and checks measurement + type
# before updating — if the current message is for a different measurement
# the sensor retains its previous state.

  # ==========================================
  # STATE OF HEALTH
  # ==========================================
  - name: "PV3 Battery SOH"
    unique_id: pv3_battery_soh_avg
    state_topic: "pv/PV3/PV001001DEV/pylontech/info"
    value_template: >
      {% set item = value_json[0] if value_json is iterable and value_json | length > 0 else {} %}
      {% if item.measurement == 'StateOfHealth' and item.type == 'Avg' %}
        {{ item.value }}
      {% else %}
        {{ states(this.entity_id) | default('unknown') }}
      {% endif %}
    unit_of_measurement: "%"
    icon: mdi:battery-heart-variant

  - name: "PV3 Battery SOH Min"
    unique_id: pv3_battery_soh_min
    state_topic: "pv/PV3/PV001001DEV/pylontech/info"
