# Powervault P3 MQTT Sensors for Home Assistant
#
# How to use
# ----------
# 1. In your Home Assistant configuration, add an MQTT integration pointing at
#    the P3's built-in broker (port 1883, no authentication required):
#
#      mqtt:
#        broker: 192.168.1.215   # <- your P3 IP
#
#    OR keep your existing HA MQTT broker and add the P3 as a second connection.
#
# 2. Copy this file to your HA config directory and add to configuration.yaml:
#
#      mqtt: !include ha-config/mqtt_sensors.yaml
#
#    Or append the sensor: section to an existing mqtt.yaml.
#
# 3. Replace every occurrence of "PV001001DEV" below with your actual device ID.
#    Discover it by subscribing: mosquitto_sub -h <P3_IP> -t 'pv/#' -v
#
# 4. Restart Home Assistant.
#
# Notes
# -----
# * The P3 MQTT broker is read-only — publishing commands does NOT control
#   the inverter. See docs/CONTROL.md for control options.
# * FFR CT channel naming is intentionally swapped vs. physical board labels:
#   LOCAL → house consumption, HOUSE → grid (confirmed on P3-1164).
# * All raw values from the P3 use milli-units (mV, mA, mW, m°C).

mqtt:
  sensor:

    # ==========================================
    # BATTERY STATE OF CHARGE (from BMS)
    # ==========================================
    - name: "PV3 Battery SoC"
      unique_id: pv3_battery_soc
      state_topic: "pv/PV3/PV001001DEV/bms/soc"
      value_template: >
        {% if value_json is iterable and value_json | length > 0 %}
          {% set item = value_json[0] %}
          {% if item.measurement == 'StateOfCharge' %}
            {{ (item.value | float(0) / 100) | round(2) }}
          {% else %}
            {{ states(this.entity_id) | default('unknown') }}
          {% endif %}
        {% elif value_json.StateOfCharge is defined %}
          {{ (value_json.StateOfCharge | float(0) / 100) | round(2) }}
        {% else %}
          {{ states(this.entity_id) | default('unknown') }}
        {% endif %}
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    # ==========================================
    # BATTERY (inverter-reported)
    # ==========================================
    - name: "PV3 Battery Voltage"
      unique_id: pv3_battery_voltage
      state_topic: "pv/PV3/PV001001DEV/inverter/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','BATTERY')
              | selectattr('measurement','eq','Voltage')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(2) }}
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "PV3 Battery Current"
      unique_id: pv3_battery_current
      state_topic: "pv/PV3/PV001001DEV/inverter/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','BATTERY')
              | selectattr('measurement','eq','ChargeCurrent')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(3) }}
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement

    - name: "PV3 Battery Capacity"
      unique_id: pv3_battery_capacity
      state_topic: "pv/PV3/PV001001DEV/inverter/measurements"
      value_template: >
        {{ (value_json
              | selectattr('channel','eq','BATTERY')
              | selectattr('measurement','eq','Capacity')
              | map(attribute='value') | list | first | default(0)) | float(0) }}
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    # ==========================================
    # BATTERY POWER (charge/discharge)
    # ==========================================
    - name: "PV3 Battery Power"
      unique_id: pv3_battery_power
      state_topic: "pv/PV3/PV001001DEV/inverter/charge"
      value_template: "{{ value_json.power | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-charging

    # ==========================================
    # GRID
    # ==========================================
    - name: "PV3 Grid Voltage"
      unique_id: pv3_grid_voltage
      state_topic: "pv/PV3/PV001001DEV/inverter/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','GRID')
              | selectattr('measurement','eq','Voltage')
              | selectattr('type','eq','Ac')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(1) }}
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement

    - name: "PV3 Grid Frequency"
      unique_id: pv3_grid_frequency
      state_topic: "pv/PV3/PV001001DEV/inverter/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','GRID')
              | selectattr('measurement','eq','Frequency')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(2) }}
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement

    # ==========================================
    # FFR MEASUREMENTS (CT clamps)
    # Note: LOCAL = house consumption, HOUSE = grid power
    # ==========================================
    - name: "PV3 House Power"
      unique_id: pv3_house_power
      state_topic: "pv/PV3/PV001001DEV/ffr/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','LOCAL')
              | selectattr('measurement','eq','Power')
              | selectattr('type','eq','Active')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(1) }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:home-lightning-bolt

    - name: "PV3 Grid Power"
      unique_id: pv3_grid_power
      state_topic: "pv/PV3/PV001001DEV/ffr/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','HOUSE')
              | selectattr('measurement','eq','Power')
              | selectattr('type','eq','Active')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(1) }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower

    - name: "PV3 AUX1 Power"
      unique_id: pv3_aux1_power
      state_topic: "pv/PV3/PV001001DEV/ffr/measurements"
      value_template: >
        {{ ((value_json
              | selectattr('channel','eq','AUX1')
              | selectattr('measurement','eq','Power')
              | selectattr('type','eq','Active')
              | map(attribute='value') | list | first | default(0)) | float(0) / 1000) | round(1) }}
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    # ==========================================
    # SCHEDULE
    # ==========================================
    - name: "PV3 Schedule Event"
      unique_id: pv3_schedule_event
      state_topic: "pv/PV3/PV001001DEV/schedule/event"
      value_template: >
        {% set events = {0: 'Idle', 1: 'Charge', 2: 'Discharge', 3: 'Force Charge', 4: 'Force Discharge'} %}
        {{ events.get(value_json.event | int, 'Unknown') }}
      icon: mdi:calendar-clock

    - name: "PV3 Schedule Setpoint"
      unique_id: pv3_schedule_setpoint
      state_topic: "pv/PV3/PV001001DEV/schedule/event"
      value_template: "{{ value_json.setpoint | default(0) | float }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    # ==========================================
    # MAX POWER LIMITS (from M4)
    # ==========================================
    - name: "PV3 Max Charge Power"
      unique_id: pv3_max_charge_power
      state_topic: "pv/PV3/PV001001DEV/m4/maxpower"
      value_template: >
        {% set payload = value_json[0] if value_json is iterable and value_json | length > 0 else value_json %}
        {{ payload.ChgPower | float(0) | round(0) }}
      unit_of_measurement: "W"
      device_class: power

    - name: "PV3 Max Discharge Power"
      unique_id: pv3_max_discharge_power
      state_topic: "pv/PV3/PV001001DEV/m4/maxpower"
      value_template: >
        {% set payload = value_json[0] if value_json is iterable and value_json | length > 0 else value_json %}
        {{ payload.DchgPower | float(0) | round(0) }}
      unit_of_measurement: "W"
      device_class: power

    # ==========================================
    # EPS STATUS
    # ==========================================
    - name: "PV3 EPS Reserve"
      unique_id: pv3_eps_reserve
      state_topic: "pv/PV3/PV001001DEV/eps/status"
      value_template: >
        {% set payload = value_json[0] if value_json is iterable and value_json | length > 0 else value_json %}
        {{ payload.Reserve | default(0) | float }}
      unit_of_measurement: "%"
      icon: mdi:battery-lock

    # ==========================================
    # INVERTER TEMPERATURES (from alarms topic)
    # ==========================================
    - name: "PV3 Inverter Temperature"
      unique_id: pv3_inverter_temp
      state_topic: "pv/PV3/PV001001DEV/inverter/alarms"
      value_template: "{{ value_json.inverter_temperature | default(0) | float }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "PV3 Boost Temperature"
      unique_id: pv3_boost_temp
      state_topic: "pv/PV3/PV001001DEV/inverter/alarms"
      value_template: "{{ value_json.boost_temperature | default(0) | float }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "PV3 Inner Temperature"
      unique_id: pv3_inner_temp
      state_topic: "pv/PV3/PV001001DEV/inverter/alarms"
      value_template: "{{ value_json.inner_temperature | default(0) | float }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    # ==========================================
    # ALARM SUMMARY
    # ==========================================
    - name: "PV3 Active Alarms"
      unique_id: pv3_active_alarms
      state_topic: "pv/PV3/PV001001DEV/inverter/alarms"
      value_template: >
        {% set exclude = ['timestamp', 'warnings_summary', 'inverter_temperature', 'boost_temperature', 'inner_temperature'] %}
        {% set ns = namespace(alarms=[]) %}
        {% for key, val in value_json.items() %}
          {% if val == '1' and key not in exclude %}
            {% set ns.alarms = ns.alarms + [key | replace('_', ' ') | title] %}
          {% endif %}
        {% endfor %}
        {{ ns.alarms | join(', ') if ns.alarms else 'None' }}
      icon: mdi:alert-circle-outline
